<!-- ================= PAGE ================= -->

<section class="publish-container">

<h1>

Подать объявление

</h1>

<p class="publish-text">

Заполните анкету и после публикации она сразу появится на сайте.

</p>

<form id="publishForm">

<!-- Фото -->

<div class="form-group">

<label>

Фотографии

</label>

<input

type="file"

id="photos"

accept="image/*"

multiple

>

</div>

<div id="preview">

</div>

<!-- Имя -->

<div class="form-group">

<label>

Имя

</label>

<input

type="text"

id="title"

placeholder="Введите имя"

required

>

</div>

<!-- Возраст -->

<div class="form-group">

<label>

Возраст

</label>

<input

type="number"

id="age"

min="18"

max="99"

required

>

</div>

<!-- Пол -->

<div class="form-group">

<label>

Пол

</label>

<select id="gender">

<option>Девушка</option>

<option>Парень</option>

<option>Пара</option>

<option>Транс</option>

</select>

</div>

<!-- Страна -->

<div class="form-group">

<label>

Страна

</label>

<input

type="text"

id="country"

placeholder="Например Украина"

required

>

</div>

<!-- Город -->

<div class="form-group">

<label>

Город

</label>

<input

type="text"

id="city"

placeholder="Введите город"

required

>

</div>

<!-- Категория -->

<div class="form-group">

<label>

Категория

</label>

<select id="goal">

<option>BDSM</option>

<option>Foot Fetish</option>

<option>Femdom</option>

<option>Findom</option>

<option>Role Play</option>

<option>Latex</option>

<option>Cosplay</option>

<option>Другое</option>

</select>

</div>

<!-- Telegram -->

<div class="form-group">

<label>

Telegram

</label>

<input

type="text"

id="telegram"

placeholder="@username"

required

>

</div>

<!-- Описание -->

<div class="form-group">

<label>

Описание

</label>

<textarea

id="description"

rows="8"

placeholder="Расскажите о себе..."

required

></textarea>

</div>

<!-- Кнопка -->

<button

type="submit"

class="publish-btn">

Опубликовать анкету

</button>
