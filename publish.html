<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Опубликовать объявление — Y-FETISH</title>

    <link rel="stylesheet" href="publish.css">
</head>

<body>

<header>
    <div class="logo">
        <span class="red">Y</span>-FETISH
    </div>
</header>

<main class="publish-container">

    <h1>Опубликовать объявление</h1>

    <form id="publishForm">

        <label for="title">Заголовок</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Введите заголовок"
            required
        >

        <label for="description">Описание</label>
        <textarea
            id="description"
            name="description"
            placeholder="Расскажите о себе..."
            required
        ></textarea>

        <label for="city">Город</label>
        <input
            type="text"
            id="city"
            name="city"
            placeholder="Ваш город"
            required
        >

        <label for="category">Категория</label>
        <select id="category" name="category" required>
            <option value="">Выберите категорию</option>
            <option value="BDSM">BDSM</option>
            <option value="Fetish">Fetish</option>
            <option value="Domina">Domina</option>
            <option value="Submissive">Submissive</option>
            <option value="Couple">Couple</option>
            <option value="Other">Другое</option>
        </select>

        <button type="submit" id="publishButton">
            Опубликовать
        </button>

        <p id="publishMessage"></p>

    </form>

</main>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Подключение базы -->
<script src="supabase.js"></script>

<!-- Логика публикации -->
<script src="publish.js"></script>

</body>
</html>
